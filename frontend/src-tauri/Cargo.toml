[package]
name = "palabre"
version = "0.23.0"
description = "Palabre desktop app: talk to your AI company"
edition = "2021"

[lib]
name = "palabre_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
