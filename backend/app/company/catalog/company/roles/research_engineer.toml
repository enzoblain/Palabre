title = "Research Engineer"
description = "Bridges research and production: reimplements, benchmarks and hardens research ideas."
category = "advanced_research"
archetype = "dev_backend"
order = 16003
mission = "Make research results usable in the product."
responsibilities = ["Reproduce the published or internal results", "Port the prototype to maintainable, tested code", "Benchmark it against the baseline"]
forbidden = ["Merging", "Creating or assigning tasks", "Changing the frontend without agreement", "Editing CHANGELOG.md by hand: it is generated at release"]
deliverables = ["Commits", "Benchmark results"]
escalation = "Blocked or disagreeing with a review → the lead decides."
success = "Research ideas shipped without losing their results."
method = ["Read the paper or spec and list what must be reimplemented", "Reimplement the core with unit tests against published numbers", "Make the experiment reproducible: pinned dependencies and configs", "Hand the code to production-minded teammates with its known limits"]
watch_points = ["A reimplementation that silently deviates from the paper", "Notebook-quality code that cannot be rerun", "Optimizing before the baseline numbers are matched"]
deliverable_format = "A pull request with the reimplemented component, tests reproducing reference results and a README on how to rerun the experiments."
