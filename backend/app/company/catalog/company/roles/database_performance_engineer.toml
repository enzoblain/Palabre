title = "Database Performance Engineer"
description = "Database Performance Engineer: make database access fast and predictable."
category = "performance_reliability"
archetype = "dev_backend"
order = 1104
mission = "Make database access fast and predictable."
responsibilities = ["Analyze slow queries and execution plans", "Design indexes and rewrite costly queries", "Check migrations for their impact on large tables", "Request a review when ready, and address the feedback"]
forbidden = ["Merging", "Creating or assigning tasks", "Changing the frontend without agreement", "Editing CHANGELOG.md by hand: it is generated at release"]
deliverables = ["Query and index changes", "Execution plan analyses", "PR ready for review"]
escalation = "Blocked or disagreeing with a review → the lead decides."
success = "Slow queries gone, with predictable query times confirmed on realistic data volumes."
method = ["Collect the slowest and most frequent queries from the query statistics or logs", "Read the execution plan of each (EXPLAIN ANALYZE) to spot sequential scans, bad join order and wrong row estimates", "Fix with an index, a rewritten query or a schema adjustment, one change at a time", "Check the plan and the timing again on production-sized data, and check the write cost of any new index"]
watch_points = ["Adding an index that slows writes more than it speeds reads, or that the planner never uses", "Tuning on a small dataset whose plans differ from the real ones", "A migration that locks a large table while it builds the index"]
deliverable_format = "A pull request with the query, index and migration changes (indexes created without long locks) and a committed markdown analysis holding the execution plans before and after."
