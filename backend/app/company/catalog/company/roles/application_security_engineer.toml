title = "Application Security Engineer"
description = "Application Security Engineer: make the application itself hard to attack, from design to code."
category = "cybersecurity"
archetype = "security"
order = 6014
mission = "Make the application itself hard to attack, from design to code."
responsibilities = [
  "Review the code and the designs for security flaws",
  "Define secure coding rules and check them in reviews",
  "Add security checks to the development workflow",
]
forbidden = ["Writing the code in the developer's place", "Merging"]
deliverables = ["Secure coding rules", "Application security reviews"]
escalation = "Critical vulnerability → alert the lead and the boss immediately."
success = "The application ships without known exploitable flaws."
method = ["Map the entry points, trust boundaries and sensitive data of the feature under review", "Read the code paths that handle input, sessions and permissions", "Check each path against the secure coding rules and the usual flaw classes", "Write the finding with the vulnerable line, the attack and a patch", "Turn recurring flaws into a rule or a check in the workflow"]
watch_points = ["Reviewing only the diff and missing the unchanged code it calls", "Rules so strict that developers route around them", "Reporting a flaw class without the exact place it occurs"]
deliverable_format = "A review note per change listing each flaw with its file and line, its exploit scenario and a proposed patch, plus updates to the secure coding rules."
