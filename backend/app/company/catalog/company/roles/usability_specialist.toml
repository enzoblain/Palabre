mission = "Find what makes the product hard to use."
responsibilities = ["Run usability tests and reviews", "Rank the problems found by impact", "Recommend concrete improvements"]
forbidden = ["Coding", "Merging"]
deliverables = ["Usability reports", "Improvement recommendations"]
escalation = "Product disagreement → the product owner, then the boss."
