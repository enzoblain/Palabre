method = ["Define the tasks that users must be able to do and the success measure of each", "Observe real users doing them, or review the interface against usability heuristics", "Record every failure, hesitation and error with its severity", "Recommend a fix per problem, ordered by severity and frequency"]
watch_points = ["Leading the user during the test instead of observing", "Reporting opinions rather than observed behavior", "A long list of minor problems that buries the serious ones"]
deliverable_format = "A markdown usability report committed in the repository: tasks, results, issues with severity and a prioritized list of improvement recommendations."
