# Signs the Swift app and sends it to TestFlight, from a version tag (vX.Y.Z) and only after the tests passed.
# Copy this file to .github/workflows/swift-testflight.yml of the Swift project (see docs/apple-testflight.md).
# Started by Palabre (POST /api/projects/{id}/testflight) or by hand from the Actions tab, on a vX.Y.Z tag.
# Never triggered by a pull request. The Apple keys are secrets of the protected environment "testflight",
# limited to v* tags: only the last job reads them, and only after the "test" job is green.
name: Swift TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (X.Y.Z), the same as the tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: swift-testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned: the default Xcode of the runner image changes without notice
  XCODE_VERSION: "26.6"

jobs:
  # No secret here: refuses a run that is not on the tag of the version asked
  verify:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "v$VERSION" ]; then
            echo "::error::Lancez la publication depuis le tag v$VERSION (ici : $REF_NAME)."
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Le numéro de version doit être de la forme X.Y.Z."
            exit 1
          fi

  # No secret here either: a red build or test ends the run before the signing job exists
  test:
    name: Build and test
    needs: verify
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APP_SCHEME: ${{ vars.APPLE_SCHEME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - name: Build and test
        run: |
          set -eu
          if [ -z "$APP_SCHEME" ]; then
            echo "::error::La variable APPLE_SCHEME (nom du scheme Xcode de l'app) manque dans le dépôt."
            exit 1
          fi
          if ! xcodebuild test -scheme "$APP_SCHEME" -destination 'platform=iOS Simulator,name=iPhone 16'; then
            echo "::error::Le build ou les tests ont échoué : rien n'est envoyé à TestFlight."
            exit 1
          fi

  testflight:
    name: Sign and upload to TestFlight
    needs: test
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    env:
      APP_VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
      APP_SCHEME: ${{ vars.APPLE_SCHEME }}
      # The runner context is not allowed in a job's env: the path is set by the first step
      KEYCHAIN_NAME: palabre-build.keychain-db
    steps:
      - name: Set the keychain path
        run: echo "KEYCHAIN_PATH=$RUNNER_TEMP/$KEYCHAIN_NAME" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - name: Import the certificate and the provisioning profile
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # No set -x: the values below are secrets
          set -eu
          for name in CERT_P12_BASE64 CERT_PASSWORD PROFILE_BASE64; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::Secret Apple manquant dans l'environnement testflight (voir docs/apple-testflight.md)."
              exit 1
            fi
          done
          keychain_password=$(uuidgen)
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          if ! security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"; then
            echo "::error::Certificat Apple illisible : mauvais mot de passe ou fichier abîmé."
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          expires_at=$(plutil -extract ExpirationDate raw -o - "$RUNNER_TEMP/profile.plist")
          expiration=$(date -u -j -f '%Y-%m-%dT%H:%M:%SZ' "$expires_at" '+%s')
          if [ "$expiration" -lt "$(date -u '+%s')" ]; then
            echo "::error::Le profil de provisionnement Apple a expiré : créez-en un nouveau."
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          {
            echo "PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
            echo "TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"
            app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
            echo "BUNDLE_ID=${app_id#*.}"
          } >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/profile.plist"
      - name: Archive and export the IPA
        run: |
          set -eu
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
          </dict></plist>
          PLIST
          # Marketing version = release version, build number = run number
          if ! xcodebuild archive -scheme "$APP_SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/app.xcarchive" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" CODE_SIGN_IDENTITY="Apple Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"; then
            echo "::error::La signature de l'app a échoué : le certificat, le profil ou l'identifiant de l'app ne correspondent pas."
            exit 1
          fi
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/ipa"
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -eu
          # altool looks for AuthKey_<id>.p8 in this folder
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          if ! xcrun altool --upload-app --type ios --file "$RUNNER_TEMP"/ipa/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" > "$RUNNER_TEMP/altool.log" 2>&1; then
            # Only the lines of Apple's answer are shown: they never hold the key
            cat "$RUNNER_TEMP/altool.log"
            if grep -Eqi 'expired|revoked' "$RUNNER_TEMP/altool.log"; then
              echo "::error::Apple refuse l'envoi : certificat ou profil expiré ou révoqué."
            elif grep -Eqi 'authenticat|401|forbidden|not authorized|invalid.*key' "$RUNNER_TEMP/altool.log"; then
              echo "::error::Apple refuse la clé App Store Connect : vérifiez la clé, son rôle (Developer ou App Manager) et le compte."
            elif grep -Eqi 'already been uploaded|bundle version|redundant binary' "$RUNNER_TEMP/altool.log"; then
              echo "::error::Cette version est déjà chez Apple : relancez la publication pour un nouveau numéro de build."
            else
              echo "::error::L'envoi à TestFlight a échoué : voir le journal de cette étape."
            fi
            exit 1
          fi
          echo "Version $APP_VERSION (build $BUILD_NUMBER) envoyée à TestFlight."
      # Whatever the result, no signing material stays on the runner
      - name: Clean up the keychain and the keys
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -rf "$HOME/private_keys" "$HOME/Library/MobileDevice/Provisioning Profiles" "$RUNNER_TEMP/altool.log" \
            "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
