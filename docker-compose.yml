services:
  db:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-palabre}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-palabre}
    secrets: [postgres_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    # Published image (`docker compose pull`); `docker compose up -d --build` builds it here instead
    image: ghcr.io/enzoblain/palabre:${PALABRE_VERSION:-0.10.1}
    build:
      context: ./backend
      args:
        EXTRA_APT_PACKAGES: ${EXTRA_APT_PACKAGES:-}
    restart: unless-stopped
    # No env_file: the secrets are files (see `secrets` below), never in the environment
    secrets: [admin_token, github_token, claude_code_oauth_tokens, postgres_password]
    # The server's private copy of the secrets stays in memory
    tmpfs:
      - /run/palabre-secrets
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-palabre}
      POSTGRES_DB: ${POSTGRES_DB:-palabre}
      TZ: ${TZ:-UTC}
      DAILY_TIME: ${DAILY_TIME-09:30}
      MERGE_REMINDER_MINUTES: ${MERGE_REMINDER_MINUTES:-10}
      RELEASE_WAIT_MINUTES: ${RELEASE_WAIT_MINUTES:-5}
      MAX_CONCURRENT_AGENTS: ${MAX_CONCURRENT_AGENTS:-3}
      # uvicorn trusts X-Forwarded-For only from the web container (fixed address below), never "*":
      # port 2710 is published directly, so anyone could forge the header there
      FORWARDED_ALLOW_IPS: ${WEB_IP:-172.29.0.2}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PALABRE_PORT:-2710}:8000"
    volumes:
      # Repositories and worktrees, Claude sessions, run files
      - palabre-data:/data
    # Leaves running agents time to stop cleanly
    stop_grace_period: 60s

  web:
    # The app in a browser (phone...): the interface, with /api passed on to the backend
    image: ghcr.io/enzoblain/palabre-web:${PALABRE_VERSION:-0.10.1}
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      default:
        ipv4_address: ${WEB_IP:-172.29.0.2}
    ports:
      - "${PALABRE_WEB_PORT:-2810}:80"

  updater:
    # Off by default: COMPOSE_PROFILES=autoupdate in .env turns it on. Every few minutes
    # it pulls the images and restarts the server and the web app if a new version came out.
    # It only sees new images under a moving tag (PALABRE_VERSION=latest), so turning it on
    # means trusting whatever is published there. It also holds the Docker socket, which is
    # root on the host: see "Automatic updates" in the README.
    image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    profiles: [autoupdate]
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project:ro
    environment:
      INTERVAL: ${PALABRE_UPDATE_INTERVAL:-300}
      PALABRE_VERSION: ${PALABRE_VERSION:-}
    # The project is reached at its path on the host (a link to /project), so the
    # containers it recreates keep the labels of this compose project
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -u
        case "$${PALABRE_VERSION:-}" in latest) ;; *) echo "Warning: PALABRE_VERSION is not 'latest' (it is '$${PALABRE_VERSION:-unset}'): this updater will never find a new version";; esac
        project=$$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$$(hostname)")
        dir=$$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$$(hostname)")
        mkdir -p "$$(dirname "$$dir")" && { [ -e "$$dir" ] || ln -s /project "$$dir"; }
        cd "$$dir"
        while true; do
          # `up` only recreates the containers whose image changed
          if docker compose -p "$$project" pull -q backend web &&
             out=$$(docker compose -p "$$project" up -d backend web 2>&1); then
            case "$$out" in *Recreate*) echo "$$(date -u '+%F %T') Updated"; echo "$$out";; esac
          else
            echo "$$(date -u '+%F %T') Update failed: $${out:-pull failed}"
          fi
          sleep "$$INTERVAL"
        done

secrets:
  # Read from .env (or the shell) and mounted as files in the containers
  admin_token:
    environment: ADMIN_TOKEN
  github_token:
    environment: GITHUB_TOKEN
  claude_code_oauth_tokens:
    environment: CLAUDE_CODE_OAUTH_TOKENS
  postgres_password:
    environment: POSTGRES_PASSWORD

networks:
  default:
    # Fixed subnet so the backend can trust the web container's address (FORWARDED_ALLOW_IPS).
    # If it clashes with a network of yours, change both here and WEB_IP in .env.
    ipam:
      config:
        - subnet: ${WEB_SUBNET:-172.29.0.0/24}

volumes:
  pgdata:
  palabre-data:
