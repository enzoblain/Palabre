services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-palabre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-palabre}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    # Published image (`docker compose pull`); `docker compose up -d --build` builds it here instead
    image: ghcr.io/enzoblain/palabre:${PALABRE_VERSION:-latest}
    build:
      context: ./backend
      args:
        EXTRA_APT_PACKAGES: ${EXTRA_APT_PACKAGES:-}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-stable}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-palabre}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-palabre}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PALABRE_PORT:-2710}:8000"
    volumes:
      # Repositories and worktrees, Claude sessions, run files
      - palabre-data:/data
    # Leaves running agents time to stop cleanly
    stop_grace_period: 60s

  web:
    # The app in a browser (phone...): the interface, with /api passed on to the backend
    image: ghcr.io/enzoblain/palabre-web:${PALABRE_VERSION:-latest}
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PALABRE_WEB_PORT:-2810}:80"

  updater:
    # Off by default: COMPOSE_PROFILES=autoupdate in .env turns it on. Every few minutes
    # it pulls the images and restarts the server and the web app if a new version came out
    image: docker:27-cli
    profiles: [autoupdate]
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project:ro
    environment:
      INTERVAL: ${PALABRE_UPDATE_INTERVAL:-300}
    # The project is reached at its path on the host (a link to /project), so the
    # containers it recreates keep the labels of this compose project
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -u
        project=$$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$$(hostname)")
        dir=$$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$$(hostname)")
        mkdir -p "$$(dirname "$$dir")" && { [ -e "$$dir" ] || ln -s /project "$$dir"; }
        cd "$$dir"
        while true; do
          # `up` only recreates the containers whose image changed
          if docker compose -p "$$project" pull -q backend web &&
             out=$$(docker compose -p "$$project" up -d backend web 2>&1); then
            case "$$out" in *Recreate*) echo "$$(date -u '+%F %T') Updated"; echo "$$out";; esac
          else
            echo "$$(date -u '+%F %T') Update failed: $${out:-pull failed}"
          fi
          sleep "$$INTERVAL"
        done

volumes:
  pgdata:
  palabre-data:
