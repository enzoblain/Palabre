# Keeps the SHA-pinned GitHub Actions and the Cargo dependencies up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: rust-rewrite
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /
    target-branch: rust-rewrite
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"
