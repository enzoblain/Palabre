# Tests and Docker image builds on pull requests to dev and main and on every push.
# Why every push: a pull_request run needs GitHub to compute a test merge commit. When the
# branch conflicts, or the PR was opened/retargeted right after a rename or force-push, GitHub
# silently starts no run and the PR shows "no CI checks reported". A push run is tied to the
# head commit, so the checks always exist on it and show on the PR.
# Python and Node match the Dockerfiles (backend: python:3.12, frontend: node:22). The test jobs
# skip what the branch does not have yet, so the workflow is green before pytest /
# `npm run check` exist.
name: CI

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Detect tests
        id: detect
        run: |
          if [ -f requirements-dev.txt ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "No requirements-dev.txt: backend tests skipped"; fi
      # Always installed, so the pip cache folder exists even when the tests are skipped
      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt
      - name: Install test dependencies
        if: steps.detect.outputs.run == 'true'
        # Both locks in one command: pip fails if they pin the same package differently
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: pytest
        if: steps.detect.outputs.run == 'true'
        run: |
          # Exit code 5 = no tests collected: tolerated, anything else fails the job
          code=0
          python -m pytest || code=$?
          if [ "$code" -eq 5 ]; then echo "No tests collected"; exit 0; fi
          exit "$code"

  frontend:
    name: Frontend check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Detect check script
        id: detect
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.check ? 0 : 1)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "No check script: frontend check skipped"; fi
      - name: Install dependencies
        if: steps.detect.outputs.run == 'true'
        run: npm ci
      - name: npm run check
        if: steps.detect.outputs.run == 'true'
        run: npm run check

  # Checks that the images build (nobody has docker locally). No push, no login, no secrets.
  docker:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: palabre, context: ./backend }
          - { image: palabre-web, context: ./frontend }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # amd64 only: the multi-arch build (QEMU) stays in release.yml
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Known vulnerabilities in the pinned backend dependencies. pip-audit lives only in this job:
  # it is in neither the image nor the requirements files.
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit --require-hashes --disable-pip -r backend/requirements.txt
