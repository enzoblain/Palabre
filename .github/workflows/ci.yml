# Tests on every pull request and on main. Python and Node match the Dockerfiles
# (backend: python:3.12, frontend: node:22). The jobs skip what the branch doesn't have yet,
# so the workflow is green before pytest / `npm run check` exist.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Detect tests
        id: detect
        run: |
          if [ -f requirements-dev.txt ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "No requirements-dev.txt: backend tests skipped"; fi
      - name: Install dependencies
        if: steps.detect.outputs.run == 'true'
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        if: steps.detect.outputs.run == 'true'
        run: |
          # Exit code 5 = no tests collected: tolerated, anything else fails the job
          code=0
          python -m pytest || code=$?
          if [ "$code" -eq 5 ]; then echo "No tests collected"; exit 0; fi
          exit "$code"

  frontend:
    name: Frontend check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Detect check script
        id: detect
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.check ? 0 : 1)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "No check script: frontend check skipped"; fi
      - name: Install dependencies
        if: steps.detect.outputs.run == 'true'
        run: npm ci
      - name: npm run check
        if: steps.detect.outputs.run == 'true'
        run: npm run check
