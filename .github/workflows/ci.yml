# Placeholder CI while the branch restarts from scratch for the Rust rewrite.
# It keeps one check that passes so the "green CI" merge rule still applies; the Rust jobs
# (fmt, clippy, test) come in a separate task. Runs on every push for the reasons the old
# workflow documented: a push run is tied to the head commit, so the check always exists.
name: CI

on:
  pull_request:
    branches: [dev, main, rust-rewrite]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  placeholder:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "Nothing to build yet: Rust rewrite in progress."
