# Tests and Docker image builds on pull requests to dev and main and on every push.
# Why every push: a pull_request run needs GitHub to compute a test merge commit. When the
# branch conflicts, or the PR was opened/retargeted right after a rename or force-push, GitHub
# silently starts no run and the PR shows "no CI checks reported". A push run is tied to the
# head commit, so the checks always exist on it and show on the PR.
# Python and Node match the Dockerfiles (backend: python:3.12, frontend: node:22). The test jobs
# skip what the branch does not have yet, so the workflow is green before pytest /
# `npm run check` exist.
name: CI

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Detect tests
        id: detect
        run: |
          if [ -f requirements-dev.txt ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "No requirements-dev.txt: backend tests skipped"; fi
      # Always installed, so the pip cache folder exists even when the tests are skipped
      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt
      - name: Install test dependencies
        if: steps.detect.outputs.run == 'true'
        # Both locks in one command: pip fails if they pin the same package differently
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: pytest
        if: steps.detect.outputs.run == 'true'
        run: |
          # Exit code 5 = no tests collected: tolerated, anything else fails the job.
          # On GitHub Actions, tests/conftest.py prints a ::error annotation per failed test or collection error.
          code=0
          python -m pytest -rfE || code=$?
          if [ "$code" -eq 5 ]; then echo "No tests collected"; exit 0; fi
          exit "$code"

  frontend:
    name: Frontend check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Detect check script
        id: detect
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.check ? 0 : 1)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "No check script: frontend check skipped"; fi
      - name: Install dependencies
        if: steps.detect.outputs.run == 'true'
        run: npm ci
      - name: npm run check
        if: steps.detect.outputs.run == 'true'
        run: npm run check

  # Unit tests of the Mac builder worker (deploy/apple-host): stdlib only, fakes instead of Tart.
  apple-host:
    name: Apple host worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: deploy/apple-host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: unittest
        run: python3 -m unittest test_worker

  # Type check, lint and tests of the mobile app. Linux only: no macOS runner and no signing here
  # (the builds are in mobile-release.yml). Skips while mobile/ has no check script.
  mobile:
    name: Mobile check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect check script
        id: detect
        working-directory: .
        run: |
          if [ -f mobile/package.json ] && node -e 'process.exit(require("./mobile/package.json").scripts?.check ? 0 : 1)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "No mobile check script: mobile check skipped"; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.detect.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        if: steps.detect.outputs.run == 'true'
        run: npm ci
      - name: npm run check
        if: steps.detect.outputs.run == 'true'
        run: npm run check

  # Checks that the images build (nobody has docker locally). No push, no login, no secrets.
  docker:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: palabre, context: ./backend }
          - { image: palabre-web, context: ., file: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # amd64 only: the multi-arch build (QEMU) stays in release.yml
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Runs the real docker-compose.yml (secrets, agent isolation, updater, upgrade of a volume
  # from the last published version). Only on PRs and on dev/main: it builds the backend
  # image and pulls the published ones, which is too slow for every branch push.
  compose:
    name: Compose smoke test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags give the last published version to upgrade from
          fetch-depth: 0
      # The published images are pulled for the upgrade step (no fork PRs, so the token has package access)
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: .github/scripts/compose-smoke.sh

  # Known vulnerabilities in the pinned backend dependencies. pip-audit lives only in this job:
  # it is in neither the image nor the requirements files.
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit --require-hashes --disable-pip -r backend/requirements.txt

  # The backend must refuse to start on an empty secret, and say why. Each case has its own
  # Compose project and port, so a /health answer can never come from another stack; the
  # reason is read in the logs of that project's own backend container.
  failfast:
    name: Fail-fast (${{ matrix.case }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { case: admin-token, project: failfast-admin, port: 28710, admin: "", pg: "pg-0123456789abcdef0123456789abcdef", reason: "ADMIN_TOKEN is blank" }
          - { case: postgres-password, project: failfast-pg, port: 28711, admin: "admin-0123456789abcdef0123456789abcdef", pg: "", reason: "POSTGRES_PASSWORD is empty or missing" }
          - { case: admin-token-short, project: failfast-admin-short, port: 28712, admin: "short-admin-secret", pg: "pg-0123456789abcdef0123456789abcdef", reason: "ADMIN_TOKEN is too short" }
          - { case: postgres-password-short, project: failfast-pg-short, port: 28713, admin: "admin-0123456789abcdef0123456789abcdef", pg: "short-pg-secret", reason: "POSTGRES_PASSWORD is too short" }
    env:
      COMPOSE_PROJECT_NAME: ${{ matrix.project }}
      PALABRE_PORT: ${{ matrix.port }}
      PALABRE_VERSION: failfast
      ADMIN_TOKEN: ${{ matrix.admin }}
      POSTGRES_PASSWORD: ${{ matrix.pg }}
      # Dummy values: Compose must find every secret's variable, only the tested one is empty
      GITHUB_TOKEN: dummy-github-token
      CLAUDE_CODE_OAUTH_TOKENS: dummy-claude-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          load: true
          tags: ghcr.io/enzoblain/palabre:failfast
          cache-from: type=gha,scope=palabre
      - name: Backend refuses to start
        run: |
          # No .env on the runner: only the variables above reach Compose. No restart loop,
          # and no db: the settings are checked before the database is touched.
          printf 'services:\n  backend:\n    restart: "no"\n' > override.yml
          docker compose -f docker-compose.yml -f override.yml up -d --no-deps --no-build --pull never backend 2>&1 || echo "compose up exited with $?"
          id=$(docker compose ps -a -q backend)
          [ -n "$id" ] || { echo "::error::No backend container in project $COMPOSE_PROJECT_NAME"; exit 1; }
          for _ in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Status}}' "$id")" = exited ] && break
            sleep 1
          done
          status=$(docker inspect -f '{{.State.Status}}' "$id")
          docker inspect -f '{{json .State}}' "$id"
          [ "$status" != created ] || { echo "::error::Backend container was created but never started: the test checks nothing"; exit 1; }
          code=$(docker inspect -f '{{.State.ExitCode}}' "$id")
          logs=$(docker logs "$id" 2>&1)
          echo "$logs"
          [ "$status" = exited ] && [ "$code" != 0 ] || { echo "::error::Backend did not fail: status=$status exit=$code"; exit 1; }
          echo "$logs" | grep -q "${{ matrix.reason }}" || { echo "::error::Refusal reason '${{ matrix.reason }}' not in the backend logs"; exit 1; }
          # The secret itself must never be echoed
          for secret in "$ADMIN_TOKEN" "$POSTGRES_PASSWORD" "$GITHUB_TOKEN" "$CLAUDE_CODE_OAUTH_TOKENS"; do
            [ -z "$secret" ] || ! echo "$logs" | grep -qF "$secret" || { echo "::error::Secret leaked in logs"; exit 1; }
          done
      - name: Clean up
        if: always()
        run: docker compose down -v --remove-orphans || true
